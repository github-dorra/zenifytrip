server {
    listen 80;
    server_name _;

    # Timeout étendu — pipeline LangGraph 27 nodes peut prendre 15-30s
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    120s;

    # Limite de taille des requêtes (messages utilisateur)
    client_max_body_size 1m;

    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Désactiver la mise en buffer pour le streaming LangGraph
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Health check — accessible sans log (évite le bruit dans les logs)
    location /health {
        proxy_pass http://app:8000/health;
        access_log off;
    }
}
